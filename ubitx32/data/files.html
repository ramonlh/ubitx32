      function gt(n) {
        $.ajax({

      function gf(n) {
        $.ajax({
          url: 'f' + n,
          success: function(result) {
            $('#f' + n).html(result);
          }
        });
      }

      function gl(n) {
        $.ajax({
          url: 'l' + n,
          success: function(result) {
            $('#l' + n).html(result);
          }
        });
      }

      function chf() {
        for (i = 7; i < 8; i++) {
          gf(i);
        }
        setTimeout(function() {
          chf();
        }, 100);
      }

      function ch() {
        gt(0);
        for (i = 0; i < 7; i++) {
          gl(i);
        }
        setTimeout(function() {
          ch();
        }, 1000);
      }

      chf();
      ch();
