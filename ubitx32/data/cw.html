      table.n {

      table.n th {
        border-style: solid;

      }
      table.n td {

  <body>
    <table class="m">
      <tr>

<form action="cw" method="post">
  <table class="n">
    <tr>
      <td>Tipo Man. CW</td>
      <td>
        <select name="0">
          <option value="0" %SEL0%>straight</option>
          <option value="1" %SEL1%>iambica</option>
          <option value="2" %SEL2%>iambicb</option>
        </select>
      </td>
      <td></td>
    </tr>
    <tr>
      <td>CW speed / Retardo</td>
      <td><input type="text" name="1" value="%CW_SPEED%" maxlength="5" size="5"></td>
      <td><input type="text" name="2" value="%CW_DELAY%" maxlength="5" size="5"></td>
    </tr>
    <tr>
      <td>PUNTO de / a</td>
      <td><input type="text" name="3" value="%PDE%" maxlength="5" size="5"></td>
      <td><input type="text" name="4" value="%PA%" maxlength="5" size="5"></td>
    </tr>
    <tr>
      <td>RAYA de / a</td>
      <td><input type="text" name="5" value="%RDE%" maxlength="5" size="5"></td>
      <td><input type="text" name="6" value="%RA%" maxlength="5" size="5"></td>
    </tr>
    <tr>
      <td>AMBOS de / a</td>
      <td><input type="text" name="7" value="%ADE%" maxlength="5" size="5"></td>
      <td><input type="text" name="8" value="%AA%" maxlength="5" size="5"></td>
    </tr>
    <tr>
      <td>ST de / a</td>

      <td><input type="text" name="10" value="%SA%" maxlength="5" size="5"></td>
    </tr>
  </table>
  <input type="submit" value="Guardar" />
</form>
