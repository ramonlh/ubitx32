    <style type="text/css">
      a:link {
        text-decoration: none;
      }
      table.m {
        font-family: 'Courier New', Courier, monospace;
        font-size: 11pt;
        border-collapse: collapse;
      }
      table.m th {
        border-width: 2px;
        padding: 8px;
        border-style: solid;
        border-color: #666666;
        background-color: #FDFF9A;
      }
      table.m td {
        border-width: 2px;
        padding: 8px;
        border-style: solid;
        border-color: #666666;
        background-color: #dedede;
      }

      table.n {
        font-family: 'Courier New', Courier, monospace;
        font-size: 11pt;
        border-collapse: collapse;
        text-align: left;
      }
      table.n th {
        border-style: solid;
        border-color: #666666;
        border-width: 2px;
        padding: 4px;
        background-color: #FFFF00;
      }
      table.n td {
        border-style: solid;

    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script>
      function gt(n) {
        $.ajax({
          url: 'tt',
          success: function (result) {
            $('#tt').html(result);
          },
        });
      }

      function gf(n) {
        $.ajax({
          url: 'f' + n,
          success: function (result) {
            $('#f' + n).html(result);
          },
        });
      }

      function gl(n) {
        $.ajax({
          url: 'l' + n,
          success: function (result) {
            $('#l' + n).html(result);
          },
        });
      }

      function chf() {
        for (i = 7; i < 8; i++) {
          gf(i);
        }
        setTimeout(function () {
          chf();
        }, 100);
      }

      function ch() {
        gt(0);
        for (i = 0; i < 7; i++) {
          gl(i);
        }
        setTimeout(function () {
          ch();
        }, 1000);
      }

      chf();
      ch();
    </script>
  </head>

  <body>
    <table class="m">
      <tr>
        <td><a href="p">Panel</a></td>
        <td><a href="sd">Configuración</a></td>

    <table class="m">

        <td><a href="es">Estado</a></td>

        <td><a href="firm">Actualizar</a></td>
        <th>Reset</th>
      </tr>
    </table>

    <br />

    <form action="rs" method="post">
      <table class="n">
        <tr>
          <td>Reset/Restart</td>
          <td>
            <select name="0">
              <option value="0" selected>No hacer nada</option>
              <option value="1">Reset</option>
              <option value="2">Restart</option>
              <option value="3">Reset WiFi</option>
              <option value="4">Reset Fábrica</option>
            </select>
          </td>
        </tr>
      </table>
      <input type="submit" value="Ejecutar" />
    </form>
  </body>
